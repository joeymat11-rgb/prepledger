name: rebuild

on:
  push:
    branches: ['rebuild/**']
  pull_request:
    branches: ['rebuild/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-gates:
    name: rebuild-public (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Raised from 15 with the 2026-09-11 CI re-seal: the native-carriers package now
    # actually completes (it used to die in ~1 min at the `focused` child), and six new
    # suites plus two pnpm installs run alongside it on both runners.
    timeout-minutes: 30
    env:
      MEASURED_TEST_NOW: '2026-09-03'
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund --include=dev
      # CI RE-SEAL, 2026-09-11. Until this step existed, every run on this branch died
      # here: the native-carriers `focused` child loads
      # rebuild/m4/spec/native-next-target-candidate/fixture.cjs, which reaches
      # rebuild/m3/w5/source/codec.cjs -> rebuild/m3/w5/reconciliation/codec.cjs ->
      # require('@noble/hashes/sha2.js'). Node resolves that from
      # rebuild/m3/w5/node_modules, and the root `npm ci` above never writes there, so
      # all three native-next-target tests died with MODULE_NOT_FOUND (`# pass 0`,
      # `# fail 3`) and the package reported FAIL. The same missing dependency is what
      # broke slice-host.yml's own build step. W6's dependencies (esbuild,
      # fake-indexeddb) are the same story for the A1/A2/A5 suites added below.
      # Both are installed from their own committed pnpm lockfiles, frozen, so CI can
      # never resolve a version this repository has not pinned and no lockfile changes.
      # Both lockfiles are lockfileVersion '9.0'; pnpm 9 is the version that wrote them
      # and the version slice-host.yml already installs.
      - name: Install pnpm 9 (the version both W6 and W5 lockfiles were written with)
        run: npm install -g pnpm@9
      # Not --ignore-scripts: esbuild's own postinstall has to run, exactly as
      # slice-host.yml's equivalent step documents, or the bundler-backed suites below
      # cannot build.
      - name: Install the pinned W6 browser-build dependencies
        run: pnpm --dir rebuild/m3/w6 install --frozen-lockfile
      # --ignore-workspace because rebuild/m3/w5/pnpm-workspace.yaml carries only
      # `allowBuilds:` and no `packages:` key, which pnpm 9 refuses outright with
      # "packages field missing or empty"; --ignore-scripts because nothing in this
      # workflow runs wrangler or workerd — only @noble/hashes has to resolve.
      - name: Install the pinned W5 source and reconciliation dependencies
        run: pnpm --dir rebuild/m3/w5 install --frozen-lockfile --ignore-scripts --ignore-workspace
      - name: Check frozen files and actual old-app package
        run: node rebuild/m3/w0/scope-package.mjs
      - name: Public law, mutant, adapter and archived-artifact checks
        run: node rebuild/m3/w0/public-conformance.cjs
      - name: Unchanged public oracle and frozen-engine witnesses
        run: node rebuild/m3/w0/public-oracle.mjs
      - name: Prove the new checks fail closed
        run: node --test rebuild/m3/w0/test/public-conformance.test.cjs rebuild/m3/w0/test/scope-package.test.mjs
      - name: Accepted synchronous client restart witness
        run: node rebuild/t2/rig187.cjs
      # B-NTC succeeds the memory-only preview with the executed durable Today,
      # gym and check-in suites below. Historical preview tests remain in Git.
      # M2-H3-CLEAN-INIT SUCCEEDS M2-B-NTC HERE, exactly as B-NTC succeeded the accepted
      # originals at ce38aa3 (it replaced "Cumulative extracted-engine native-carrier and
      # legacy-census evidence" / `node rebuild/m4/spec/native-carriers-package.cjs --ci`
      # with its own line). A cumulative profile carries its parent's evidence forward, so
      # the child's gate IS the standing step and the parent's is retired, not kept beside
      # it: H3 re-pins packages/B-NTC.json onto the r10 runner, and a spec so re-pinned no
      # longer recomputes the artifact B-NTC's own seal stands on. Same position, same job,
      # same matrix; one command changes.
      # M2-S3-COMPANION SUCCEEDS M2-H3-CLEAN-INIT HERE, by the same rule (ce38aa3, then
      # H3's r3c): the child's gate IS the standing step and the parent's is retired, not
      # kept beside it. S3 registers itself in the runner (its bytes move), re-pins
      # packages/H3.json onto that runner, and H3's own sealed artifact no longer recomputes
      # beside it. Same position, same job, same matrix; one command changes. Until the PM's
      # theme, brief-by-sha and GATE-SUPERSESSION lines for M2-S3-COMPANION stand on the
      # chain branch this step reports the runner's own refusal by name rather than PASS;
      # that is the expected pre-ruling state (b-package.cjs, REQUESTS 08:40 (b)).
      # M2-S4-REAL-DAY SUCCEEDS M2-S3-COMPANION HERE, by the same rule again (ce38aa3,
      # then H3's r3c, then S3's own): a cumulative profile carries its parent's
      # evidence forward, so the child's gate IS the standing step and the parent's is
      # retired rather than kept beside it. S4 registers itself in the runner (its bytes
      # move), re-pins packages/S3.json onto that runner, and S3's own sealed artifact no
      # longer recomputes beside it. Same position, same job, same matrix; one command
      # changes. UNLIKE H3 and S3, S4 changes NO byte under rebuild/engine, so it declares
      # no gate supersession and needs no GATE-SUPERSESSION token line: the five
      # byte-identity carriers stand exactly as the parent map leaves them. Until the PM's
      # theme and brief-by-sha lines for M2-S4-REAL-DAY stand on the chain branch this step
      # reports the runner's own refusal by name rather than PASS; that is the expected
      # pre-ruling state, and the brief predicts the token.
      # M2-S5-TODAY-CHILD SUCCEEDS M2-S4-REAL-DAY HERE, by the same rule a fourth time
      # (ce38aa3, then H3's r3c, then S3's own, then S4's): a cumulative profile carries its
      # parent's evidence forward, so the child's gate IS the standing step and the parent's
      # is retired rather than kept beside it. S5 registers itself in the runner (its bytes
      # move), re-pins packages/S4.json onto that runner, and S4's own sealed artifact no
      # longer recomputes beside it. Same position, same job, same matrix; one command
      # changes. WHY THIS CHILD EXISTS AT ALL, and it is not a behaviour change of its own:
      # DECISIONS:455 rules that S4 sealed every product file under
      # rebuild/m3/w7-preview/today/**, so lane C's ACCEPTED P-MEASURE bytes can only reach
      # the tip inside a lane B reseal child. S5 pins them and moves no engine byte. LIKE S4
      # and UNLIKE the comment S4 left here, it DOES declare a gate supersession: a
      # second-generation descendant of S3 inherits the same refusing byte-identity
      # reconstructions (DECISIONS:153, :422 note 3, :443), so the nine are retired again
      # under S5's own token line with S5's own red-first cells. Until the PM's theme,
      # brief-by-sha and GATE-SUPERSESSION lines for M2-S5-TODAY-CHILD stand on the chain
      # branch this step reports the runner's own refusal by name rather than PASS; that is
      # the expected pre-ruling state, and the brief predicts the exact refusal.
      # M2-S7-PORT-ADMISSION SUCCEEDS M2-S6-TODAY-CHILD HERE, by the same rule a sixth
      # time, and the flip lives INSIDE the package rather than at the fast-forward.
      # DECISIONS:498 measured the cost of doing it after the seal: rebuild.yml is a
      # declared product file, so a post flipped after the sealed run refuses
      # WORKTREE-SOURCE-PIN on the byte-identity step. VERDICT-S6.md records the rule.
      # S7 carries the accepted P3-PORT-FIX and P3-PORT-FIX-2 change on the owner's own
      # data path (DECISIONS:508, :509, :510); it moves no rebuild/engine byte and it
      # retires the same nine byte-identity gates again under its own token line. Until
      # the PM's theme, brief-by-sha and GATE-SUPERSESSION lines for M2-S7-PORT-ADMISSION
      # stand on the chain branch this step reports the runner's own refusal by name
      # rather than PASS; that is the expected pre-ruling state.
      # The step NAME is corrected here as DECISIONS:501 carries it (it still read S5
      # under the S6 seal, which was cosmetic and is not any more).
      # M2-S8-REAL-SHAPE SUCCEEDS M2-S7-PORT-ADMISSION HERE, by the same rule a seventh
      # time, and the flip again lives INSIDE the package rather than at the
      # fast-forward: VERDICT-S6.md rule (a), the cost of doing it afterwards measured
      # at DECISIONS:498. S8 carries the accepted P3-REAL-SHAPE and P3-LAYOUT-V2 change
      # on the owner's own data path (DECISIONS:521, :522, :523); it moves no
      # rebuild/engine byte and it retires the same nine byte-identity gates again under
      # its own token line. Until the PM's theme, brief-by-sha and GATE-SUPERSESSION
      # lines for M2-S8-REAL-SHAPE stand on the chain branch this step reports the
      # runner's own refusal by name rather than PASS; that is the expected pre-ruling
      # state, and the brief predicts the exact refusal. The step NAME moves with it.
      - name: Cumulative S8 real shape, S7 port admission, S6 today child, S5 today child, S4 real day, S3 companion, H3 clean-init, native-carrier and legacy-census evidence
        run: node rebuild/lanes/b/tooling/b-package.cjs --ci --package S8
      # The slice suites get their CI home here (DECISIONS 99/101/102 deferred them to
      # this re-seal). Each file is named rather than globbed so the same set runs on
      # both runners whatever the shell does with a wildcard.
      # M2-S4-REAL-DAY names its own cells here too, by exact path and never
      # globbed, for the reason DECISIONS:186 (3) gives: a file with no CI home is
      # a file nobody runs. It lives under rebuild/m3/w6/host/test/ because that is
      # one of the runner's fixed child roots, so the same file is ALSO executed by
      # the package step above as the declared child `s4-real-day` - named twice on
      # purpose, so it runs whether or not the package step is the standing one.
      # M2-S6-TODAY-CHILD ADDS food-live-save.test.mjs AND host-seams.test.mjs HERE, under
      # the same DECISIONS:117 (4) licence every step below rides and for the reason
      # DECISIONS:186 (3) gives: a file with no CI home is a file nobody runs.
      # food-live-save.test.mjs arrived at 5c231e4a with the FOOD-LIVE-SAVE fix and is the
      # :485 casualty of the custody hole - it repaired a defect that refused every food day
      # and machine note written on the shipped build since 2026-09-15, and it merged on its
      # own CI because the two files it moves were in no package at all. host-seams.test.mjs
      # has stood in this directory with no workflow naming it. Both roots are already
      # CHILD_ROOTS, so both are ALSO declared children of the package step above - named
      # twice on purpose, so they run whether or not the package step is the standing one.
      - name: A0 — the workout host over the real durable client, S4's real-day cells, the host seams and the live food/machine-note save
        run: node --test rebuild/m3/w6/host/test/journey.test.mjs rebuild/m3/w6/host/test/engine-equivalence.test.cjs rebuild/m3/w6/host/test/local-real-day.test.mjs rebuild/m3/w6/host/test/food-live-save.test.mjs rebuild/m3/w6/host/test/host-seams.test.mjs
      # ENUMERATION COMPLETED BY M2-B-NTC, DECISIONS:109. The line below named
      # five files; two more existed under the same directory with no CI home at
      # all — A3's check-in suite (checkin.test.mjs, deferred by DECISIONS 99/101/102
      # and never picked up) and B-NTC's own delta cells (ntc-h6-delta.test.mjs).
      # :109 rules that "rebuild.yml enumerates checkin.test.mjs + any unlisted
      # today/gym test files" rides the B-NTC seal, so both are named here. The
      # rule the step already stated is kept: every file is named rather than
      # globbed, so the same set runs on both runners whatever the shell does.
      # DECISIONS:142 (2), option (b): the :117 (4) enumeration of A4's own
      # setup.test.mjs RIDES H3's seal — H3 re-pins rebuild.yml as B-NTC's child,
      # and there is no further B-NTC re-seal. setup.test.mjs stands on the tip
      # and is named here rather than globbed, like every other file in this step.
      # DECISIONS:177 (A), applied by M2-H3-CLEAN-INIT r3 under the same :112 licence
      # that lets this package re-pin .github at all. Every file present under
      # rebuild/m3/w7-preview/today/test/ is named here by path and still never
      # globbed: catalogue.test.mjs and problem.test.mjs (the :173 F-H pair);
      # copy.test.mjs, which - measured across all five files in .github/workflows -
      # was named in NO workflow in this repo at all, not "enumerated elsewhere";
      # and machine-settings-ui.test.mjs, which DECISIONS:177 (1) names and which
      # arrived with the settings display at :179 (added in r3b - it was absent from
      # the tip r3 sealed on, and H3-REVIEW-r3's probe (iv) measured H3/13 RED on
      # exactly that file).
      # NO FILE IS HELD OUT ANY LONGER. DECISIONS:186 closes the last exception:
      # food.test.mjs, lane C's N1 suite, is named here too. It was held out through
      # r3/r3b/r3c because two of its cells executed the PRE-H3 engine as their
      # expectation (N1.11, D2.1) and its build cells raced view.test.mjs's R3 in a
      # shared invocation; :185 made it engine-version-aware and un-raced the
      # directory, so both reasons are gone and H3 names it rather than hold it out.
      # THE RULE THIS STEP NOW STATES IN FULL: every file present under
      # rebuild/m3/w7-preview/today/test/ is named here by exact path, all thirteen,
      # with no glob and no exception - so a file added to that directory has a CI
      # home or turns cell H3/13 red, and nothing named here can be absent.
      # Measured in the lane-b/h3 worktree at this head: setup.test.mjs 157 tests,
      # 157 pass, 0 fail; food.test.mjs 57 tests, 57 pass, 0 fail; the thirteen files
      # together 547 tests, 547 pass, 0 fail, exit 0 - three consecutive runs of the
      # exact argv below, agreeing with lane C's own two runs of the directory.
      # The older note "no dependency" was already wrong and is corrected: checkin,
      # copy, gym, machine-settings-ui, problem and setup import jsdom, installed by
      # the pinned W6 browser-build step above. No lockfile of this step's own.
      # M2-S5-TODAY-CHILD ADDS THE FOUR PAGE-STACK MEASURE SUITES HERE, and DECISIONS:117
      # (4) is the rule it rides: rebuild.yml is pinned by the accepted engine artifact, so
      # any step lands only inside a re-pinning engine package, and lane C's work therefore
      # RIDES THE SEAL as a DISCLOSED HUNK — exactly as the C5 coach step rode B-NTC's.
      # THE FOUR, and why they are here rather than in shared-preflight.yml: journey, lane,
      # baseline and boundary mount the REAL Today route over jsdom and fake-indexeddb, and
      # shared-preflight's allowlist cannot open the page stack, so P-MEASURE's own report
      # records them as running in NO workflow at all (DECISIONS:457 (i), an honest gap
      # carried into S5 rather than a finding). model and adherence are hermetic and stay
      # where lane C registered them, in shared-preflight.yml, which S5 does not touch.
      # THE 13-NAME RULE STILL HOLDS AND IS THE CEREMONY THAT ADMITS THESE FOUR. Cell H3/13
      # reads the today/test/ paths off THIS line and requires them to equal the directory
      # exactly - every one of them, nothing else, no glob and no hold-out (DECISIONS:186).
      # It reads today/test/ paths and only those, so naming a measure file here neither
      # satisfies nor breaks it: the thirteen are still thirteen and still exact. What the
      # enumeration IS, for the measure suites, is the whole of their admission - there is
      # no other ceremony and no glob standing in for one, so a fifth measure page suite
      # added later has no CI home until some package names it here on purpose, which is
      # precisely the property DECISIONS:186 (3) asks of a file: "a file with no CI home is
      # a file nobody runs". Named by exact path, never globbed, so both runners agree.
      - name: A1/A2/A3/A4 — the rebound Today page, the gym card, the check-in, the B-NTC delta cells and first-run setup; and P-MEASURE's four page-stack suites
        run: node --test rebuild/m3/w7-preview/today/test/adapter.test.mjs rebuild/m3/w7-preview/today/test/catalogue.test.mjs rebuild/m3/w7-preview/today/test/checkin.test.mjs rebuild/m3/w7-preview/today/test/copy.test.mjs rebuild/m3/w7-preview/today/test/design.test.cjs rebuild/m3/w7-preview/today/test/food.test.mjs rebuild/m3/w7-preview/today/test/gym.test.mjs rebuild/m3/w7-preview/today/test/machine-settings-ui.test.mjs rebuild/m3/w7-preview/today/test/ntc-h6-delta.test.mjs rebuild/m3/w7-preview/today/test/package.test.cjs rebuild/m3/w7-preview/today/test/problem.test.mjs rebuild/m3/w7-preview/today/test/setup.test.mjs rebuild/m3/w7-preview/today/test/view.test.mjs rebuild/m3/w7-preview/measure/test/journey.test.mjs rebuild/m3/w7-preview/measure/test/lane.test.mjs rebuild/m3/w7-preview/measure/test/baseline.test.mjs rebuild/m3/w7-preview/measure/test/boundary.test.mjs
      # DECISIONS:117 (4). rebuild.yml is pinned by the accepted engine artifact, so any
      # step lands only inside a re-pinning engine package (DECISIONS:112's standing rule) —
      # lane C's C5 voice coach therefore RIDES THE B-NTC SEAL as one more disclosed hunk,
      # listed in BRIEF-B-NTC-NATIVE-TREND-CONTEXT.md §4. The glob is the PM's own wording
      # and is quoted so both runners expand it the same way: node's --test does the
      # expansion itself, not the shell. Measured in the lane-b/ntc worktree at this head:
      # 64 tests, 64 pass, 0 fail, exit 0. No dependency, no lockfile.
      #
      # A4's rebuild/m3/w7-preview/today/test/setup.test.mjs IS enumerated in the today
      # step above, as of H3. :117 (4) enumerated it "only if it exists on the tip when
      # B-NTC seals"; it did not, so DECISIONS:142 (2) took option (b) — it rides H3's
      # seal instead, and B-NTC is not re-sealed for it.
      # M2-S6-TODAY-CHILD GIVES THE MERGED-BUT-UNRUN SUITES A CI HOME. This is the whole
      # second half of the package (DECISIONS:473 as :487 extends it). Measured before it
      # was written: rebuild.yml had exactly 12 `run:` steps and shared-preflight.yml one,
      # and NOT ONE of them named rebuild/m4/import, rebuild/lanes/d/ or
      # rebuild/m3/w7-preview/import - so every suite below ran in no workflow at all while
      # the modules under it shipped to the phone. Each file is named by exact path and
      # never globbed, so both runners agree whatever the shell does; each is also a
      # declared child of the package step above, so it runs whether or not that step is
      # the standing one. THREE SUITES ARE DELIBERATELY ABSENT and the author report says
      # why: m4/import/test/s3/harness.test.mjs (3 pass / 14 fail identically HERE and on
      # the clean tip - an environment precondition, the IMPORT_M4_DIR class of :459 NOTE
      # 3) and import/test/edge-route.mjs, which needs W6_BROWSER_BIN and a real Edge that
      # no runner has. edge-route.mjs and its edge-seed-entry.mjs are declared and pinned
      # as product all the same, so a file with no CI home is a file somebody decided about
      # (DECISIONS:186 (3)).
      # ROUND 2: lanes/d/p3-replay-all WAS the third absentee. It was green on the tip and
      # red after this merge, reported as BLOCKING rather than hidden by leaving it unrun,
      # and lane D's P3-EN1-ROUTE-GRAPH (DECISIONS:493 (1)) has since landed the
      # enumeration fix. It is 28/28 on this tree, so it has a step and a declared child.
      - name: P3 — the Import screen route, its refusals and its page-bundle law
        run: node --test rebuild/m3/w7-preview/import/test/route.test.mjs rebuild/m3/w7-preview/import/test/refusal-route.test.mjs rebuild/m3/w7-preview/import/test/live-clock.test.mjs rebuild/m3/w7-preview/import/test/page-bundle.test.mjs rebuild/m3/w7-preview/import/test/refusals.test.mjs
      - name: M4 — the import lane, its production mapping and its admission
        run: node --test rebuild/m4/import/test/prepare.test.cjs rebuild/m4/import/test/reading-replay.test.cjs rebuild/m4/import/test/engine-provider.test.cjs rebuild/m4/import/test/local-source-order.test.cjs rebuild/m4/import/test/browser-parity.test.mjs rebuild/m4/import/test/production-mapping.test.cjs rebuild/m4/import/test/production-admission.test.mjs
      - name: D — plan edit, import retract, the admission swap, the replay measure family and capture-start
        run: node --test rebuild/lanes/d/plan-edit/model.test.cjs rebuild/lanes/d/plan-edit/durable-host.test.mjs rebuild/lanes/d/plan-edit/browser-build.test.mjs rebuild/lanes/d/plan-edit/client-p6.test.cjs rebuild/lanes/d/import-retract/retract.test.mjs rebuild/lanes/d/p3-followons/admission-swap.test.mjs rebuild/lanes/d/p3-replay-measure/measure-family.test.mjs rebuild/lanes/d/p3-replay-measure/measure-order.test.mjs rebuild/lanes/d/p3-capture-start/capture-start.test.mjs
      - name: D — the replay register and the shipped page's writer enumeration
        run: node --test rebuild/lanes/d/p3-replay-all/class-membership.test.mjs rebuild/lanes/d/p3-replay-all/sleep-family.test.mjs rebuild/lanes/d/p3-replay-all/writer-enumeration.test.mjs rebuild/lanes/d/p3-replay-all/writer-order.test.mjs
      - name: D — the legacy order mapping, its provider and its route
        run: node --test rebuild/lanes/d/b-lom/legacy-order.test.mjs rebuild/m4/workout/test/legacy-order-mapping.test.cjs
      # M2-S7-PORT-ADMISSION ADDS ITS OWN THREE LANE CELLS HERE, under the same
      # DECISIONS:117 (4) licence and for the same DECISIONS:186 (3) reason: they arrived
      # with P3-PORT-FIX and P3-PORT-FIX-2 (DECISIONS:509, :510) and no workflow names
      # them, so without this step they are three suites the phone's admission path
      # depends on and nobody runs. Named by exact path and never globbed.
      - name: D - the port admission programme rule, the owner's route and the capture codes
        run: node --test rebuild/lanes/d/p3-port-fix/programme-rule.test.mjs rebuild/lanes/d/p3-port-fix/owner-route.test.mjs rebuild/lanes/d/p3-port-fix/capture-codes.test.mjs
      # M2-S8-REAL-SHAPE ADDS ITS OWN LANE CELLS HERE, under the same DECISIONS:117 (4)
      # licence and for the same DECISIONS:186 (3) reason S7's three are named above:
      # they arrived with P3-REAL-SHAPE and P3-LAYOUT-V2 (DECISIONS:522, :523) and no
      # workflow names them, so without this step they are six suites the phone's
      # admission and adoption path depends on and nobody runs. The two P3-LAYOUT-V2
      # cells under rebuild/lanes/d/p3-layout-v2/ are named in the same step for the
      # same reason. Named by exact path and never globbed.
      - name: D - the real-shape admission and adoption rule, the bar, and the v2 capture layout
        run: node --test rebuild/lanes/d/p3-real-shape/real-shape-walk.test.mjs rebuild/lanes/d/p3-real-shape/real-shape-capture.test.mjs rebuild/lanes/d/p3-real-shape/bar-admit.test.mjs rebuild/lanes/d/p3-real-shape/bar-keep.test.mjs rebuild/lanes/d/p3-real-shape/r1-fixes.test.mjs rebuild/lanes/d/p3-real-shape/q1-producer.test.mjs rebuild/lanes/d/p3-layout-v2/layout-v2.test.mjs rebuild/lanes/d/p3-layout-v2/projector-parity.test.mjs
      - name: W6 — the local source admission and consumer cells
        run: node --test rebuild/m3/w6/test/local-source-admission.test.mjs rebuild/m3/w6/test/local-source-consumer.test.mjs
      - name: C5 — the voice coach tool contract and text prototype
        run: node --test "rebuild/coach/test/*.test.cjs"
      - name: A5 — the PWA shell's lockfile-only suites
        run: node --test rebuild/slice/pwa/test/pwa.test.cjs rebuild/slice/pwa/test/workflow.test.cjs
      - name: A5 — the built deploy folder itself
        run: node --test rebuild/slice/pwa/test/package.test.cjs
      # C - the two S9 design-pack pin cells (S9-RELEASE-SPEC.md C.5.1 and C.5.3, hunks
      # H19 and H19b). PACK-PIN walks the owner-approved pack in the WORKING TREE this
      # workflow checked out, never an object at a fixed commit, and APPROVED-PIN reads
      # design.APPROVED at run time for its file list, so both judge the branch being
      # pushed. Both run on ubuntu AND windows, which is where R4 N1.1's forward-slash
      # and path-byte-order rules are proved. Both REFUSE BY NAME until the S9 integrator
      # fills their literals at the S9 head by C.5.1's and C.5.3's procedures: that red is
      # the cells working, and it is not closed by editing them. Named by exact path,
      # never globbed, so both runners agree whatever the shell does.
