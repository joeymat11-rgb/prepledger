name: shared-preflight

on:
  push:
    branches: ['rebuild/**']
  pull_request:
    branches: ['rebuild/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-preflight:
    name: shared-preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # persist-credentials: false by construction: anonymous HTTPS, no token,
      # no stored helper and no remote left after the closed public reads.
      # Materialize named blobs directly; never ask Git to apply repository
      # attributes/filters to a broader checkout or download a repository archive.
      - id: public-source
        name: Materialize only the event's declared public test inputs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
          const CURRENT = [".github/workflows/shared-preflight.yml","package.json","package-lock.json","rebuild/lanes/tooling/preflight.cjs","rebuild/lanes/tooling/test/preflight.test.cjs","rebuild/lanes/tooling/test/shared-preflight-ci-registration.test.cjs","rebuild/client/README.md","rebuild/client/bodycomp.cjs","rebuild/client/canonical.cjs","rebuild/client/copy.cjs","rebuild/client/face.cjs","rebuild/client/index.cjs","rebuild/client/lease.cjs","rebuild/client/ops.cjs","rebuild/client/outbox.cjs","rebuild/client/package.json","rebuild/client/plan.cjs","rebuild/client/session.cjs","rebuild/client/store.cjs","rebuild/client/sync.cjs","rebuild/client/test/reason-on-disk.test.cjs","rebuild/client/test/fixtures/base-index.cjs","rebuild/client/test/fixtures/base-copy.cjs","rebuild/m3/w7-preview/measure/measure-model.mjs","rebuild/m3/w7-preview/measure/measure-sources.mjs","rebuild/m3/w7-preview/measure/measure-view.mjs","rebuild/m3/w7-preview/measure/measure-fixture.json","rebuild/m3/w7-preview/measure/test/model.test.mjs","rebuild/m3/w7-preview/measure/test/adherence.test.mjs"];
          const OPTIONAL = ["rebuild/lanes/tooling/preflight-dash-scan.cjs"];
          const HISTORY = {"2b9b09a564531d415df847cd668ea357233687b2":["rebuild/m3/w7-preview/today/build.mjs","rebuild/m3/w7-preview/today/gym-app.mjs","rebuild/m3/w7-preview/today/plain-copy.cjs"],"0e652ce213b56cd5d73a670e0a761cca8c94b6c3":["rebuild/m3/w7-preview/today/build.mjs","rebuild/m3/w7-preview/today/gym-app.mjs","rebuild/m3/w7-preview/today/plain-copy.cjs","rebuild/lanes/tooling/preflight.cjs"]};
          const root=process.cwd(),expected=process.env.CANDIDATE_SHA;
          const check=(ok,code)=>{if(!ok){const error=new Error(code);error.preflightCode=code;throw error;}};
          const env={...process.env,GIT_TERMINAL_PROMPT:'0',GIT_CONFIG_NOSYSTEM:'1',GIT_CONFIG_GLOBAL:path.join(root,'.git','empty-config')};
          const prefix=['-c','credential.helper=','-c','core.askPass=','-c','core.hooksPath='+path.join(root,'.git','no-hooks')];
          const git=(args,input)=>cp.execFileSync('git',[...prefix,...args],{cwd:root,env,input,windowsHide:true,stdio:['pipe','pipe','pipe'],maxBuffer:16*1024*1024});
          const text=args=>git(args).toString('utf8').trim();
          try {
            check(/^[a-f0-9]{40}$/.test(expected||''),'EVENT-SHA');
            check(process.env.GITHUB_REPOSITORY==='joeymat11-rgb/prepledger','EVENT-REPOSITORY');
            check(fs.readdirSync(root).length===0,'FRESH-PUBLIC-WORKSPACE');
            const version=/git version (\d+)\.(\d+)/.exec(text(['--version']));
            check(version&&(Number(version[1])>2||(Number(version[1])===2&&Number(version[2])>=28)),'GIT-SPARSE-VERSION');
            git(['init','--quiet','--template=']);
            git(['config','core.autocrlf','false']);
            git(['config','gc.auto','0']);
            git(['sparse-checkout','set','--no-cone','--stdin'],CURRENT.concat(OPTIONAL).map(p=>'/'+p).join('\n')+'\n');
            git(['remote','add','origin','https://github.com/joeymat11-rgb/prepledger.git']);
            git(['config','remote.origin.promisor','true']);
            git(['config','remote.origin.partialclonefilter','blob:none']);
            const capability=cp.spawnSync('git',[...prefix,'-c','protocol.version=2','ls-remote','--refs','origin'],
              {cwd:root,env:{...env,GIT_TRACE_PACKET:'1'},encoding:'utf8',windowsHide:true,maxBuffer:16*1024*1024});
            check(capability.status===0&&/\bfetch=[^\r\n]*\bfilter\b/.test(capability.stderr||''),'FILTER-CAPABILITY');
            for(const sha of new Set([expected,...Object.keys(HISTORY)])) {
              git(['fetch','--quiet','--filter=blob:none','--depth=1','--no-tags','--no-recurse-submodules','origin',sha]);
            }
            git(['update-ref','refs/heads/public-candidate',expected]);
            git(['symbolic-ref','HEAD','refs/heads/public-candidate']);
            git(['read-tree',expected]);
            git(['update-index','--skip-worktree','-z','--stdin'],git(['ls-files','-z']));
            const blobIds=new Set(),materialized=[];
            function publicBlob(at,file,required=true) {
              const entry=text(['ls-tree',at,'--',file]);
              if(!entry&&!required)return null;
              const [metadata,name]=entry.split('\t'),[mode,type,oid]=(metadata||'').split(' ');
              check(name===file&&mode==='100644'&&type==='blob'&&/^[a-f0-9]{40}$/.test(oid||''),'PUBLIC-INPUT-MISSING-OR-NONREGULAR');
              blobIds.add(oid);return git(['cat-file','blob',oid]);
            }
            for(const file of CURRENT.concat(OPTIONAL)) {
              const bytes=publicBlob(expected,file,CURRENT.includes(file));if(bytes===null)continue;
              const target=path.resolve(root,file);
              check(target.startsWith(root+path.sep),'PUBLIC-PATH-CONTAINMENT');
              fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);materialized.push(file);
            }
            git(['update-index','--no-skip-worktree','--',...materialized]);
            let historical=0;
            for(const [sha,files] of Object.entries(HISTORY))for(const file of files){publicBlob(sha,file);historical++;}
            const presentBlobs=text(['cat-file','--batch-all-objects','--batch-check=%(objectname) %(objecttype)'])
              .split('\n').filter(line=>line.endsWith(' blob')).map(line=>line.split(' ')[0]);
            check(presentBlobs.length===blobIds.size&&presentBlobs.every(oid=>blobIds.has(oid)),'UNEXPECTED-FETCHED-BLOB');
            git(['remote','remove','origin']);
            check(text(['remote'])==='','NO-FETCH-REMOTE-REMAINS');
            check(text(['rev-parse','HEAD'])===expected,'CHECKED-OUT-EVENT-SHA');
            const files=[];
            function walk(dir='') {
              for(const entry of fs.readdirSync(path.join(root,dir),{withFileTypes:true})) {
                if(!dir&&entry.name==='.git')continue;
                check(!entry.isSymbolicLink(),'MATERIALIZED-SYMLINK');
                const name=dir?dir+'/'+entry.name:entry.name;
                if(entry.isDirectory())walk(name);else files.push(name);
              }
            }
            walk();
            check(files.length===materialized.length&&files.every(file=>materialized.includes(file)),'MATERIALIZED-ALLOWLIST');
            fs.mkdirSync(path.join(root,'.tmp'));
            console.log('SHARED-PREFLIGHT CHECKOUT '+expected+'; '+materialized.length+' current / '+historical+' historical inputs; '+blobIds.size+' unique public blobs; no fetch remote');
          } catch(error) {
            console.error('SHARED-PREFLIGHT CHECKOUT FAIL '+(error.preflightCode||'GIT-OR-IO'));
            process.exitCode=1;
          }
          NODE
      - id: install
        name: Install the existing root lock without lifecycle hooks
        run: npm ci --no-audit --no-fund --include=dev --ignore-scripts
      - id: regressions
        name: Execute the actual shared preflight and registration regressions
        env:
          TEMP: ${{ github.workspace }}/.tmp
          TMP: ${{ github.workspace }}/.tmp
        run: node --test rebuild/lanes/tooling/test/preflight.test.cjs rebuild/lanes/tooling/test/shared-preflight-ci-registration.test.cjs rebuild/client/test/reason-on-disk.test.cjs rebuild/m3/w7-preview/measure/test/model.test.mjs rebuild/m3/w7-preview/measure/test/adherence.test.mjs
