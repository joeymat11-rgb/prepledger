<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earned · Additions preview B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#F4F0E8;--ink:#1C1B18;--muted:#5A5348;--line:#D8D0C2;--green:#2E5A3C;--ground:#E7E1D4;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 'Instrument Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:3px}button{min-height:44px}h1,h2,p{margin:0}h1,h2,.number,.brand{font-family:'Instrument Serif',Georgia,serif;font-weight:400}h1{font-size:47px;line-height:1.04;letter-spacing:-.025em}h2{font-size:30px;line-height:1.15}.stage{display:grid;justify-items:center;gap:16px;padding:24px 8px}.review{width:min(390px,100%);font-size:13px;color:var(--muted)}.review nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.review button{background:transparent;border:1px solid #a49b8d;border-radius:6px;padding:5px 10px}.review button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.phone{width:390px;max-width:100%;height:844px;overflow:hidden;border-radius:30px;background:var(--paper);border:1px solid #cbc3b5}.view{height:100%;overflow:auto;scrollbar-width:none}.page{padding:25px 23px 20px;min-height:100%;display:flex;flex-direction:column}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}.brand{font-size:27px}.muted{color:var(--muted)}.small{font-size:14px}.intro{margin:27px 0 23px}.intro .label{color:var(--green);margin-bottom:9px}.intro p:last-child{margin-top:12px;color:var(--muted);max-width:31ch}.food{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:15px 0 5px}.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}.number{font-size:37px;line-height:1.2}.unit{font-size:14px}.link{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:8px 0;text-align:left;font-size:15px;text-decoration:underline;text-decoration-color:#b7ae9f;text-underline-offset:5px}.link svg{width:18px;height:18px;flex:none}.food .link{margin-top:2px}.training{padding:19px 0 12px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.training p{margin-top:7px}.recovery-link{font-size:14px;color:var(--green);margin-top:5px}.trend{font-size:14px;color:var(--muted);margin-top:15px}.bottom{margin-top:auto;padding-top:20px}.primary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;width:100%;padding:15px 17px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:14px;font-weight:600;text-align:left}.primary svg{width:21px;height:21px;flex:none}.coach-entry{width:100%;padding-top:13px;text-decoration:none;min-height:51px}.coach-entry .sub{font-size:13px;color:var(--muted);display:block;margin-top:2px}.back{background:none;border:0;padding:3px 0;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:left}.back svg{width:18px;height:18px}.detail-head{margin:22px 0 25px}.detail-head p{color:var(--muted);margin-top:13px}.macro-row{padding:17px 0;border-bottom:1px solid var(--line)}.macro-row:first-child{border-top:1px solid var(--ink)}.macro-row strong{font-size:16px;font-weight:500}.macro-row .number{font-size:35px}.macro-row p{font-size:14px;color:var(--muted);margin-top:3px}.note{padding:18px 0;color:var(--muted);font-size:15px}.question{border:0;padding:17px 0;margin:0;border-top:1px solid var(--line)}.question legend{float:left;width:100%;padding:0 0 10px;font-size:16px}.options{clear:both;display:flex;flex-wrap:wrap;gap:8px}.option{border:1px solid #a99e8d;border-radius:8px;padding:9px 12px;background:none;font-size:14px}.option[aria-pressed=true]{background:var(--ink);color:var(--paper)}.note-label{display:block;font-size:15px;margin-bottom:8px}textarea{width:100%;min-height:80px;border:1px solid #a99e8d;background:#faf7f1;border-radius:9px;padding:12px;resize:vertical}.prompt{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:left;background:none;font-size:15px}.prompt:first-child{border-top:1px solid var(--ink)}.conversation{margin-top:23px}.user-question{margin-left:28px;background:var(--ground);border-radius:15px 15px 3px 15px;padding:13px 15px;font-size:15px}.answer{padding-top:22px}.answer .byline{font-size:14px;color:var(--green);margin-bottom:9px}.answer p{font-size:16px;margin-bottom:13px}.source-note{border-left:2px solid var(--line);padding-left:12px;color:var(--muted);font-size:14px}.composer{display:flex;align-items:center;gap:8px;border:1px solid #a99e8d;border-radius:14px;padding:6px 7px 6px 13px;background:#faf7f1}.composer input{background:none;border:0;min-width:0;flex:1;font-size:15px;padding:7px 0}.send{width:44px;flex:none;border:0;border-radius:9px;background:var(--ink);color:var(--paper);font-size:22px}.caption{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}.status{font-size:14px;color:var(--green);margin:12px 0}dialog{width:min(350px,calc(100vw - 32px));border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:24px;color:var(--ink)}dialog::backdrop{background:#1c1b1859}dialog h2{margin-bottom:15px}dialog .primary{margin-top:20px}@media(max-width:350px){.page{padding:22px 18px}.intro h1{font-size:43px}.row{gap:8px}.number{font-size:33px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.checkin .detail-head{margin:17px 0 19px}.checkin h1{font-size:39px}.checkin .detail-head p{font-size:14px;line-height:1.45;margin-top:9px}.checkin .question{padding:12px 0}.checkin .question legend{font-size:15px;padding-bottom:8px}.checkin .options{gap:7px}.checkin .option{padding:8px 11px;font-size:14px}.sleep-line{display:flex;align-items:center;gap:9px;margin-bottom:10px}.hours{width:80px;min-height:44px;border:1px solid #a99e8d;border-radius:8px;background:#faf7f1;padding:8px 10px}.sleep-line label{font-size:14px}.quality-label{font-size:13px;color:var(--muted);margin-bottom:7px}.followup{margin-top:12px;padding:12px;background:var(--ground);border-radius:9px}.followup[hidden]{display:none}.followup label{display:block;font-size:14px;margin-bottom:7px}.followup input,.followup select{font:inherit;font-size:14px;max-width:100%;width:100%;min-height:44px;border:1px solid #a99e8d;background:var(--paper);border-radius:7px;padding:9px;margin-bottom:10px}.followup p{font-size:13px;color:var(--muted);margin-bottom:8px}.checkin .bottom{padding-top:15px}.checkin-note summary{cursor:pointer;min-height:44px;padding:10px 0;font-size:14px;color:var(--muted)}.checkin .caption{font-size:13px}.checkin .fine{font-size:13px;color:var(--muted);margin:12px 0 0}
</style></head><body><main class="stage"><aside class="review"><strong>Earned · Additions preview B</strong><br>Proposed design · Fictional targets · Scripted coach · No saving<br><a href="Earned-design-preview.pdf">Download the original four-screen overview</a><nav aria-label="Preview screens"><button data-screen="today">Today</button><button data-screen="nutrition">Nutrition</button><button data-screen="recovery">Recovery</button><button data-screen="coach">Coach</button></nav></aside><section class="phone" aria-label="Earned additions concept"><div class="view" id="view"></div></section><aside class="review">Your approved styling is preserved. These additions are a proposal, not a working or scientifically qualified app.</aside></main><dialog><h2>Design preview</h2><p id="dialog-text"></p><button class="primary" id="close">Back to the preview</button></dialog><script>
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
const back='<button class="back" data-screen="today"><span aria-hidden="true">←</span> Today</button>';
const view=document.getElementById('view');let screen='today',priorFocus;
const pages={
today:()=>`<article class="page"><header class="mast"><span class="brand">Earned</span><span class="small muted">Tuesday, September 8</span></header><section class="intro"><p class="label">Your plan for today</p><h1>Keep the plan.</h1><p>Your recent progress supports the plan you’ve agreed to.</p></section><section class="food"><p class="small">Eat about</p><div class="food-grid"><div><span class="number">2,300</span> <span class="unit">kcal</span></div><div><span class="number">160</span> <span class="unit">g protein</span></div></div><button class="link" data-screen="nutrition">Your full nutrition plan ${arrow}</button></section><section class="training"><div class="row"><h2>Upper body</h2><span class="small muted">About 60 min</span></div><p class="small muted">9 exercises · Your set targets are ready</p><button class="link recovery-link" data-screen="recovery">How are you feeling today? ${arrow}</button></section><p class="trend">Weight trend 180.9 lb · View your progress</p><div class="bottom"><button class="primary" data-info="workout">Start upper body ${arrow}</button><button class="link coach-entry" data-screen="coach"><span>Ask your coach<span class="sub">Your plan, progress and the reasons behind it.</span></span>${arrow}</button></div></article>`,
nutrition:()=>`<article class="page">${back}<header class="detail-head"><h1>Your food plan.</h1><p>Your agreed daily targets, together in one place.</p></header><section aria-label="Example macro targets">${[['Energy','2,300','kcal','Eat about this much across your day.'],['Protein','160','g','Your daily protein target.'],['Carbohydrate','235','g','Your agreed carbohydrate target.'],['Fat','80','g','Your agreed fat target.']].map(([label,n,u,copy])=>`<div class="macro-row"><div class="row"><strong>${label}</strong><span><span class="number">${n}</span> <span class="unit">${u}</span></span></div><p>${copy}</p></div>`).join('')}</section><p class="note">Targets guide your day. Any suggested change comes with a reason and your choice to accept it.</p><div class="bottom"><button class="primary" data-screen="coach">Ask about this plan ${arrow}</button><button class="link" data-info="nutrition">What would prompt a change?</button></div></article>`,
recovery:()=>`<article class="page checkin">${back}<header class="detail-head"><h1>A quick check-in.</h1><p>A few details to help put today’s training in context. Answer what you can; leave the rest blank.</p></header>
<fieldset class="question"><legend>Last night’s sleep</legend><div class="options" style="display:block"><div class="sleep-line"><input class="hours" id="sleep-hours" type="number" min="0" max="24" step="any" inputmode="decimal" placeholder="—"><label for="sleep-hours">hours asleep, approximately</label></div><p class="quality-label" id="quality-label">How was the quality?</p><div class="options" role="group" aria-labelledby="quality-label">${['Poor','Okay','Good'].map(x=>`<button class="option" aria-pressed="false" data-group="sleep">${x}</button>`).join('')}</div></div></fieldset>
<fieldset class="question"><legend>Energy right now</legend><div class="options">${['Low','Moderate','High'].map(x=>`<button class="option" aria-pressed="false" data-group="energy">${x}</button>`).join('')}</div></fieldset>
<fieldset class="question"><legend>Muscle soreness right now</legend><div class="options">${['None','Mild','Significant'].map(x=>`<button class="option" aria-pressed="false" data-group="soreness">${x}</button>`).join('')}</div><div class="followup" id="soreness-followup" hidden><label for="sore-location">Which muscles?</label><input id="sore-location" placeholder="For example, quads and glutes"><label for="sore-impact">Does it affect your usual movement?</label><select id="sore-impact"><option value="">Leave unanswered</option><option>No</option><option>A little</option><option>Quite a lot</option><option>Not sure</option></select></div></fieldset>
<fieldset class="question"><legend>Stress right now</legend><div class="options">${['Low','Moderate','High'].map(x=>`<button class="option" aria-pressed="false" data-group="stress">${x}</button>`).join('')}</div></fieldset>
<fieldset class="question"><legend>Anything else affecting today?</legend><div class="options">${['Pain','Feeling ill','Time away'].map(x=>`<button class="option" aria-pressed="false" data-toggle="true">${x}</button>`).join('')}</div>
<div class="followup" id="pain-followup" hidden><p>Keep pain separate from ordinary muscle soreness.</p><label for="pain-location">Where, and during which movement?</label><input id="pain-location" placeholder="Location and movement"><label for="pain-change">Is this new or changed?</label><select id="pain-change"><option value="">Leave unanswered</option><option>New</option><option>Worse than before</option><option>Ongoing, unchanged</option><option>Improving</option><option>Not sure</option></select><label for="pain-impact">How does it affect movement?</label><select id="pain-impact"><option value="">Leave unanswered</option><option>No noticeable effect</option><option>I change how I move</option><option>I cannot do the movement</option><option>Not sure</option></select></div>
<div class="followup" id="ill-followup" hidden><label for="ill-note">What symptoms, and when did they start?</label><input id="ill-note" placeholder="What you have noticed"></div>
<div class="followup" id="away-followup" hidden><label for="away-days">About how many days away from training?</label><input id="away-days" type="number" min="0" step="1" inputmode="numeric" placeholder="Days"><label for="away-reason">What was the reason?</label><input id="away-reason" placeholder="Optional"></div></fieldset>
<details class="checkin-note"><summary>Add a note, if useful</summary><label class="note-label" for="recovery-note">Anything the answers missed?</label><textarea id="recovery-note" placeholder="What else should your coach know?"></textarea></details>
<div class="bottom"><button class="primary" data-info="recovery">Add today’s context ${arrow}</button><p class="caption">Your answers belong alongside your training data.</p></div></article>`,
coach:()=>`<article class="page">${back}<header class="detail-head" style="margin-bottom:12px"><h1>Ask your coach.</h1><p>Make sense of your plan and the progress behind it.</p></header><section class="conversation"><div class="user-question">What changed in my chest press plan?</div><div class="answer"><p class="byline">Earned</p><p>Your agreed plan calls for <strong>9 reps at 135 lb</strong> on the first set. Last time, you logged <strong>8 reps at that load.</strong></p><p>That’s one more rep to aim for. Log what you actually complete; the target isn’t a record of what you did.</p><div class="source-note">Based on your current workout plan and previous recorded set.</div><button class="link" data-info="records">See the supporting records ${arrow}</button></div></section><div class="bottom"><button class="prompt" data-info="question">What has improved this month?</button><form class="composer" style="margin-top:15px"><input aria-label="Question for your coach" placeholder="Ask about your plan…"><button class="send" aria-label="Send question">↑</button></form><p class="caption">This conversation doesn’t change your plan.</p></div></article>`
};
function render(name){screen=pages[name]?name:'today';view.innerHTML=pages[screen]();view.scrollTop=0;document.querySelectorAll('nav [data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===screen))}
const descriptions={workout:'The workout continues into the approved set-logging design. This additions preview does not start or save a workout.',nutrition:'The product should explain any qualified adjustment using relevant trends, intake, training and recovery context. Exact rules and required inputs are still being assessed. These numbers are fictional.',recovery:'Preview only: nothing was saved and no training decision was made. Unanswered items remain unknown, not normal. Each signal needs a qualified role alongside your performance and personal history; this form does not produce a readiness score.',records:'This scripted example has no connected records. The working coach will need links to the actual plan and relevant history.',question:'The working coach will answer from your actual records. This visual preview has scripted content only.'};
function show(text){priorFocus=document.activeElement;document.getElementById('dialog-text').textContent=text;document.querySelector('dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){render(b.dataset.screen);return}if(b.dataset.info){show(descriptions[b.dataset.info]);return}if(b.dataset.group){const selected=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('[data-group="'+b.dataset.group+'"]').forEach(x=>x.setAttribute('aria-pressed',!selected&&x===b));if(b.dataset.group==='soreness')document.getElementById('soreness-followup').hidden=selected||b.textContent==='None';return}if(b.dataset.toggle){const pressed=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',pressed);const id={'Pain':'pain-followup','Feeling ill':'ill-followup','Time away':'away-followup'}[b.textContent];if(id)document.getElementById(id).hidden=!pressed;return}if(b.id==='close')document.querySelector('dialog').close()});
document.addEventListener('submit',e=>{e.preventDefault();show('This is a visual preview with scripted answers. Your question was not sent or saved.')});document.querySelector('dialog').addEventListener('close',()=>priorFocus?.focus());render(new URLSearchParams(location.search).get('screen'));
</script></body></html>
