<style>
:root{--paper:#F4F0E8;--ink:#1C1B18;--muted:#5A5348;--line:#D8D0C2;--green:#2E5A3C;--ground:#E7E1D4;color-scheme:light;font-size:16px}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:'Instrument Sans',Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:4px}button{touch-action:manipulation}button:disabled{cursor:default;opacity:.55}button:active:not(:disabled){transform:translateY(1px)}
.stage{display:flex;align-items:center;flex-direction:column;gap:16px;padding:26px 14px 40px}.review{width:min(100%,420px);font-size:13px;color:var(--muted)}.review strong{color:var(--ink);font-weight:600}.review p{margin:0 0 10px}.review-nav{display:flex;flex-wrap:wrap;gap:8px}.review-nav button{padding:9px 12px;border:1px solid #a49b8d;border-radius:6px;background:transparent;min-height:40px}.review-nav button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.phone{width:390px;max-width:100%;height:844px;background:var(--paper);border-radius:34px;box-shadow:0 0 0 1px #cbc3b5,0 15px 45px #1c1b180d;overflow:hidden;position:relative}.view{height:100%;overflow:auto;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.page{padding:28px 24px 22px;min-height:100%;display:flex;flex-direction:column}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}.brand{font-family:'Instrument Serif',Georgia,serif;font-size:26px;line-height:1}.date{color:var(--muted);font-size:14px}.serif,h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400}h1,h2,p{margin:0}.quiet{color:var(--muted)}.small{font-size:14px}.rule{border:0;border-top:1px solid var(--line);margin:0}.text-link{border:0;background:transparent;padding:9px 0;min-height:44px;text-align:left;font-size:15px;display:inline-flex;align-items:center;gap:9px;text-decoration:underline;text-decoration-color:#b7ae9f;text-underline-offset:5px}.text-link svg{width:17px;height:17px}.arrow{width:22px;height:22px;flex-shrink:0}.cta{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:14px;min-height:58px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;font-weight:600;font-size:16px;text-align:left}.cta.secondary{background:transparent;color:var(--ink)}.bottom{margin-top:auto;padding-top:22px}.bottom-note{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.intro{margin-top:31px}.intro .day-label{font-size:16px;color:var(--green);margin-bottom:8px}.intro h1{font-size:54px;line-height:1.02;letter-spacing:-.035em}.intro .intro-copy{font-size:16px;margin-top:12px;max-width:30ch;color:var(--muted)}.food{margin-top:27px;padding:19px 0 20px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}.section-label{font-size:15px;margin-bottom:12px}.food-values{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}.food-value{font-family:'Instrument Serif',Georgia,serif;font-size:38px;line-height:1.15;letter-spacing:-.02em}.food-value span{font-family:'Instrument Sans',Arial,sans-serif;font-size:15px;letter-spacing:0;margin-left:4px}.food-values .quiet{font-size:14px;margin-top:3px}.training{padding:18px 0 16px;border-bottom:1px solid var(--line)}.training-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.training h2{font-size:31px;line-height:1.1}.training p{margin-top:7px;font-size:14px;color:var(--muted)}.training .training-note{color:var(--ink);font-size:15px;line-height:1.45;margin-top:9px}.evidence{padding-top:18px}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence .datum{font-size:21px;line-height:1.5}.datum span{font-size:14px}.evidence .trend-note{font-size:14px;color:var(--muted);margin-top:6px}.evidence .text-link{margin-top:1px}
.gym-nav{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;gap:10px}.back{border:0;background:none;padding:6px 0;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.back svg{width:18px;height:18px}.gym-head{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.gym-head h1{font-size:48px;letter-spacing:-.025em;line-height:1}.gym-head .text-link{font-size:14px}.change{margin-top:12px;color:var(--green);font-size:14px;line-height:1.5}.change .why-inline{display:inline;border:0;border-bottom:1px solid #8a9c85;background:none;padding:0;color:var(--green);font-size:inherit;min-height:28px}.set-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:21px 0 19px}.slot{border-top:2px solid var(--line);padding-top:9px;color:var(--muted);font-size:13px}.slot strong{display:block;font-size:18px;font-weight:500;margin-top:3px}.slot.current{border-color:var(--ink);color:var(--ink)}.slot.done{border-color:var(--green);color:var(--green)}.prescription{padding-bottom:17px;border-bottom:1px solid var(--line)}.prescription h2{font-size:32px;line-height:1.2}.prescription .effort-target{font-size:15px;margin-top:7px;color:var(--muted)}.entry{margin-top:18px}.entry-header{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:11px}.entry-header h2{font-family:'Instrument Sans',Arial,sans-serif;font-size:16px;font-weight:500}.entry-header span{font-size:13px;color:var(--muted)}.fields{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.field label{display:block;font-size:14px;margin-bottom:6px;color:var(--muted)}.number-control{display:flex;align-items:center;border:1px solid #9e9587;border-radius:10px;background:#faf7f1;overflow:hidden;height:58px}.number-control input{width:100%;min-width:0;text-align:center;border:0;outline-offset:-4px;background:transparent;padding:6px 0;font-size:25px;font-weight:500;font-variant-numeric:tabular-nums;-moz-appearance:textfield}.number-control input::-webkit-inner-spin-button,.number-control input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.step{width:40px;min-width:40px;align-self:stretch;padding:0;background:transparent;border:0;font-size:25px;color:var(--muted)}.effort{border:0;padding:0;margin:17px 0 0}.effort legend{font-size:15px;margin-bottom:10px}.effort legend .quiet{font-size:13px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.choice{border:1px solid #a99e8d;background:transparent;min-height:44px;border-radius:8px;font-size:15px;padding:7px 2px}.choice[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.choice:last-child{font-size:13px}.error{color:#8b3225;font-size:14px;margin-top:10px;min-height:0}.gym-actions{margin-top:20px}.secondary-row{display:flex;justify-content:space-between;gap:15px;margin-top:5px}.secondary-row .text-link{font-size:14px}.next-lift{border-top:1px solid var(--line);margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:15px}.next-lift .quiet{font-size:13px}.next-lift .name{font-size:17px;margin-top:2px}
.saved-block{margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.saved-title{font-size:16px;font-weight:500;display:flex;align-items:center;gap:7px}.saved-title svg{width:19px;height:19px;color:var(--green)}.saved-facts{font-size:14px;color:var(--muted);margin-top:5px}.rest{padding-top:27px}.rest .rest-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.rest h2{font-size:35px}.rest .timer{font-family:'Instrument Serif',Georgia,serif;font-size:85px;line-height:1.07;letter-spacing:-.03em;margin:10px 0 13px}.timer-unit{font-family:'Instrument Sans',Arial,sans-serif;font-size:14px;letter-spacing:0;margin-left:9px;color:var(--muted)}.rest-buttons{display:flex;gap:8px}.rest-buttons button{border:1px solid #a99e8d;background:transparent;border-radius:8px;padding:8px 14px;min-height:44px;font-size:14px}.next-set{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.next-set .small{color:var(--muted);margin-bottom:8px}.next-set h2{font-size:32px;line-height:1.2}.next-set p{color:var(--muted);font-size:15px;margin-top:8px}.rest .quiet{font-size:14px}.status-text{margin-top:18px;font-size:14px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);width:min(350px,calc(100vw - 36px));padding:24px;max-height:80vh;overflow:auto}dialog::backdrop{background:#1c1b1859}dialog h2{font-size:33px;line-height:1.08;margin-bottom:18px}dialog p{margin:0 0 15px;font-size:16px}dialog .cta{margin-top:21px}.large .page{font-size:20px}.large .small,.large .quiet,.large .text-link,.large .date,.large .section-label,.large .intro-copy,.large .training p,.large .training-note,.large .effort-target,.large .field label,.large .effort legend{font-size:19px}.large .page{min-height:100%;height:auto}.large .next-lift{margin-top:24px}
@media(max-width:430px){.stage{padding:12px 8px 25px}.phone{width:390px;border-radius:25px}.page{padding-left:22px;padding-right:22px}}@media(max-width:350px){.page{padding-left:18px;padding-right:18px}.intro h1{font-size:46px}.food-value{font-size:33px}.gym-head h1{font-size:44px}.step{min-width:32px;width:32px}.field input{font-size:23px}.entry-header{flex-wrap:wrap}.phone{height:844px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.cta svg{width:22px;height:22px;flex:0 0 22px}
.status-text{display:none}
</style>
</head>
<body><main class="stage"><aside class="review"><p><strong>Earned · Refinement A</strong><br>Design preview · Fictional sample data · No real saving</p><nav class="review-nav" aria-label="Preview scenarios"><button data-scenario="today" aria-pressed="true">Today</button><button data-scenario="gym" aria-pressed="false">Log a set</button><button data-scenario="rest" aria-pressed="false">Saved & rest</button><button id="large" aria-pressed="false">Larger text</button></nav></aside><section class="phone" aria-label="Earned design preview"><div id="view" class="view"></div></section><aside class="review">Review only. The approved design and development app are unchanged. Reloading resets this prototype.</aside></main><dialog id="details"><h2 id="detail-title"></h2><div id="detail-body"></div><button class="cta" id="close-details">Back to my plan <span aria-hidden="true">←</span></button></dialog>
<script>
const arrow='<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
const backArrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg>';
const state={screen:'today',started:false,set:1,weight:135,reps:9,effort:null,logs:[],remaining:150,running:false};
const view=document.querySelector('#view');let lastFocus;
function header(){return `<div class="gym-nav"><button class="back" data-action="today">${backArrow}Upper body</button><span>Exercise 1 of 9</span></div><div class="gym-head"><h1>Chest press</h1><button class="text-link" data-action="setup">Setup ${arrow}</button></div><p class="change">One more rep than last time. <button class="why-inline" data-action="progression">Why?</button></p>`}
function strip(){return `<div class="set-strip" aria-label="Set progress">${[1,2,3,4].map((n)=>{const l=state.logs[n-1];return `<div class="slot ${l?'done':n===state.set?'current':''}" ${n===state.set?'aria-current="step"':''}>Set ${n}<strong>${l?l.reps+' logged':[9,9,8,8][n-1]+' reps'}</strong></div>`}).join('')}</div>`}
function today(){return `<article class="page"><header class="mast"><div class="brand">Earned</div><div class="date">Tuesday, September 8</div></header><section class="intro"><p class="day-label">Your plan for today</p><h1>Keep the plan.</h1><p class="intro-copy">Your recent progress supports the plan you’ve agreed to.</p></section><section class="food"><div class="section-label">Eat about</div><div class="food-values"><div><div class="food-value">2,300<span>kcal</span></div><div class="quiet">Today’s target</div></div><div><div class="food-value">160<span>g protein</span></div><div class="quiet">Across your day</div></div></div></section><section class="training"><div class="training-top"><h2>Upper body</h2><span class="small quiet">About 60 min</span></div><p>9 exercises${state.started?' · Workout in progress':''}</p><p class="training-note">${state.started?'Your place is kept. Pick up at chest press.':'Your next workout is ready, including today’s set targets.'}</p></section><section class="evidence"><div class="evidence-grid"><div><div class="small quiet">This morning <span aria-hidden="true">✓</span></div><div class="datum">181.3 <span>lb</span></div></div><div><div class="small quiet">Weight trend</div><div class="datum">180.9 <span>lb</span></div></div></div><p class="trend-note">Trend down 1.1 lb/week. No change today.</p><button class="text-link" data-action="plan">Why this plan? ${arrow}</button></section><div class="bottom"><button class="cta" data-action="start">${state.started?'Resume upper body':'Start upper body'} ${arrow}</button><p class="bottom-note">${state.started?'Continue from the last set you logged.':'Your workout opens at your next exercise.'}</p></div></article>`}
function gym(){return `<article class="page">${header()}${strip()}<section class="prescription"><div class="small quiet">This set’s plan</div><h2>135 lb × ${[9,9,8,8][state.set-1]} reps</h2><p class="effort-target">Aim to finish with 2 clean reps left.</p></section><section class="entry"><div class="entry-header"><h2>What you did · Set ${state.set}</h2><span>Last time: 135 lb × ${[8,9,8,8][state.set-1]}</span></div><div class="fields"><div class="field"><label for="weight">Weight (lb)</label><div class="number-control"><button class="step" data-step="weight:-5" aria-label="Decrease weight">−</button><input id="weight" type="number" inputmode="decimal" min="0" step="any" value="${state.weight}" aria-label="Actual weight in pounds"><button class="step" data-step="weight:5" aria-label="Increase weight">+</button></div></div><div class="field"><label for="reps">Reps</label><div class="number-control"><button class="step" data-step="reps:-1" aria-label="Decrease reps">−</button><input id="reps" type="number" inputmode="numeric" min="0" step="1" value="${state.reps}" aria-label="Actual reps"><button class="step" data-step="reps:1" aria-label="Increase reps">+</button></div></div></div><fieldset class="effort"><legend>Clean reps left <span class="quiet">at the end</span></legend><div class="choices">${['0','1','2','3+','Unsure'].map(x=>`<button class="choice" type="button" data-effort="${x}" aria-pressed="${state.effort===x}">${x}</button>`).join('')}</div></fieldset><p class="error" id="error" role="status"></p></section><div class="gym-actions"><button class="cta" data-action="log">Log set ${state.set} ${check}</button><div class="secondary-row"><button class="text-link" data-action="effort-help">What counts as a clean rep?</button><button class="text-link" data-action="options">Options</button></div></div><div class="next-lift"><div><div class="quiet">Up next</div><div class="name">Machine fly</div></div><button class="text-link" data-action="workout">All 9 ${arrow}</button></div></article>`}
function timerText(){return Math.floor(state.remaining/60)+':'+String(state.remaining%60).padStart(2,'0')}
function rest(){const l=state.logs[state.logs.length-1]||{weight:135,reps:9,effort:'2'};const finished=state.set===4;return `<article class="page">${header()}<section class="saved-block" aria-live="polite"><div><div class="saved-title">${check}Set ${state.set} logged</div><p class="saved-facts">${l.weight} lb × ${l.reps} reps · ${l.effort==='Unsure'?'Effort unknown':l.effort+' clean reps left'}</p></div><button class="text-link" data-action="undo">Undo</button></section><section class="rest"><div class="rest-heading"><h2>Take your rest.</h2><span class="small quiet">2:30 planned</span></div><div class="timer"><span id="timer">${timerText()}</span><span class="timer-unit">remaining</span></div><div class="rest-buttons"><button data-action="add-time">+30 seconds</button><button data-action="pause" id="pause">${state.running?'Pause':'Start timer'}</button></div></section><section class="next-set"><p class="small">${finished?'Chest press complete':'Next · Set '+(state.set+1)+' of 4'}</p><h2>${finished?'Machine fly':'135 lb × '+[9,9,8,8][state.set]+' reps'}</h2><p>${finished?'Your next exercise is ready.':'Keep the same load. Aim for 2 clean reps left.'}</p></section><p class="status-text">${finished?'All four sets are recorded in this preview.':'You can leave this screen and come back to your place.'}</p><div class="bottom"><button class="cta" data-action="next">${finished?'View next exercise':'Ready for set '+(state.set+1)} ${arrow}</button><button class="text-link" data-action="today">Back to Today</button></div></article>`}
function render(screen){state.screen=screen;view.innerHTML=screen==='today'?today():screen==='gym'?gym():rest();view.scrollTop=0;document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===screen));}
function dialog(title,paras){lastFocus=document.activeElement;document.querySelector('#detail-title').textContent=title;const b=document.querySelector('#detail-body');b.replaceChildren(...paras.map(t=>{const p=document.createElement('p');p.textContent=t;return p}));document.querySelector('#close-details').firstChild.textContent=state.screen==='today'?'Back to my plan ':'Back to my workout ';document.querySelector('#details').showModal()}
const info={plan:['Why keep this plan?',['Your recent weight trend is moving within your agreed range, and your recent workout performance supports continuing.','Today’s food and training targets stay as agreed. A single scale reading does not change the plan.','At the next review, we’ll consider your trend, training, recovery and how manageable the plan has been.']],progression:['Why one more rep?',['In this example, today’s agreed first-set target is 9 reps at the same 135 lb load. Last time you recorded 8.','The original prescription stays visible. Log what actually happens; meeting a target does not automatically change your plan.']],setup:['Your chest press setup',['Use the same machine and seat position as the previous comparable session.','This preview does not contain your actual setup notes.']], 'effort-help':['What is a clean rep?',['A rep you could complete with the same range of motion and control, without changing your technique to finish it.','Estimate how many more you could have done at the end of the set. If you can’t tell, choose Unsure.']],options:['Workout options',['The working app will provide the applicable skip, correction and early-finish actions here.','This review prototype focuses on the logging layout. These options do not change any records.']],workout:['Your workout',['This prototype shows chest press and the transition to machine fly.','The complete routine and its prescriptions belong to the development app, not this layout preview.']]};
document.addEventListener('input',e=>{if(e.target.id==='weight'||e.target.id==='reps')state[e.target.id]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.scenario){state.running=false;if(b.dataset.scenario==='today'){render('today');return}state.started=true;state.set=1;state.weight=135;state.reps=9;state.effort=null;state.logs=[];state.remaining=150;if(b.dataset.scenario==='rest')state.logs=[{weight:135,reps:9,effort:'2'}];render(b.dataset.scenario);return}
if(b.id==='large'){const p=document.querySelector('.phone');p.classList.toggle('large');b.setAttribute('aria-pressed',p.classList.contains('large'));return}
if(b.dataset.step){const[k,d]=b.dataset.step.split(':');const val=Number(state[k]);state[k]=Math.max(0,(Number.isFinite(val)?val:0)+Number(d));document.querySelector('#'+k).value=state[k];return}
if(b.dataset.effort){state.effort=b.dataset.effort;document.querySelectorAll('[data-effort]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#error').textContent='';return}
const a=b.dataset.action;if(info[a]){dialog(...info[a]);return}if(a==='today'){render('today');return}if(a==='start'){state.started=true;render(state.logs.length===state.set?'rest':'gym');return}
if(a==='log'){const w=Number(state.weight),r=Number(state.reps);if(String(state.weight).trim()===''||String(state.reps).trim()===''||!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<0){document.querySelector('#error').textContent='Enter the weight and reps you actually completed.';return}if(state.effort===null){document.querySelector('#error').textContent='Choose clean reps left, or Unsure.';return}state.logs[state.set-1]={weight:w,reps:r,effort:state.effort};state.remaining=150;state.running=true;render('rest');return}
if(a==='undo'){const l=state.logs.pop();if(l){state.weight=l.weight;state.reps=l.reps;state.effort=l.effort}state.running=false;render('gym');return}
if(a==='next'){if(state.set===4){dialog(...info.workout);return}state.running=false;state.set++;state.weight=135;state.reps=[9,9,8,8][state.set-1];state.effort=null;render('gym');return}
if(a==='add-time'){state.remaining+=30;document.querySelector('#timer').textContent=timerText();return}if(a==='pause'){state.running=!state.running;b.textContent=state.running?'Pause':'Start timer';return}
if(b.id==='close-details')document.querySelector('#details').close();});
document.querySelector('#details').addEventListener('close',()=>lastFocus?.focus());
setInterval(()=>{if(state.running&&state.remaining>0){state.remaining--;const t=document.querySelector('#timer');if(t)t.textContent=timerText();if(state.remaining===0){state.running=false;const p=document.querySelector('#pause');if(p)p.textContent='Start timer'}}},1000);
render(new URLSearchParams(location.search).get('screen')==='gym'?'gym':'today');
</script></body></html>
