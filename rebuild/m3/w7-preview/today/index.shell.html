<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Earned — Today</title>
  <!-- No font link. The two Instrument typefaces are the repository's own pinned files,
       inlined into styles.css, so this page fetches nothing and launches with no network
       (review F9). -->

  <!-- The bundle is an ES module (the same browser build the phone host uses emits ESM). -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="stage">
    <aside class="review">
      <p id="today-identity">Earned · Today</p>
      <p id="today-storage">Checking this device's local storage…</p>
      <p id="today-status" role="status">Ready.</p>
    </aside>
    <section class="phone" aria-label="Earned Today">
      <div class="view" id="phone">
        <p class="note">Opening today…</p>
        <noscript>Today needs JavaScript. Nothing has been recorded.</noscript>
      </div>
    </section>
    <aside class="review">Weights, workouts and check-ins share this device’s encrypted store. Nutrition projection for initial setup is not available yet.</aside>
  </main>
