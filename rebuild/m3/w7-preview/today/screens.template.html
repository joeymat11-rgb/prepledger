<!-- A4 · Dad's first run (?screen=setup). SIX screens in ONE frame: a masthead
     carrying the brand and a quiet "n of 6", a back control on every screen but
     the first, one question, and one primary action inside the 390x844 viewport.
     Every class token here is an approved-stylesheet selector; every word is bound
     at runtime from setup-model.mjs COPY, which design.cjs binds as this screen's
     named preview-owned vocabulary (SETUP_PREVIEW_COPY) and checks for U+2013 and
     U+2014 (DECISIONS:114 (1)). Nothing here carries a figure: the two declared
     standards and the "n of 6" counter are composed by the view. -->
