      </div>
    </div>
    <!-- C-UI-3 END (the proposal card) -->
  </div>
    <!-- N2 · the sleep entry (DECISIONS:167). The approved prototype has no sleep
         screen at all, so both this entry's label and the screen behind it are
         preview-owned and declared in design.cjs; the template carries no literal. -->
  <button class="link on-scene day-foot" type="button" data-go="sleep" data-own data-slot="sleep-entry"><span data-slot="sleep-entry-label"></span> <span class="muted" data-own data-slot="sleep-state"></span></button>
  <button class="link on-scene day-foot" type="button" data-go="why"><span data-slot="trend"></span></button>

         hidden and the route refuses, so setup can never run twice (S13). Its
         words are bound at runtime from setup-model.mjs. -->
  <button class="link on-scene day-foot" type="button" data-go="setup" data-own data-slot="setup-entry" hidden><span data-slot="setup-entry-label"></span></button>
    <!-- REPORT A PROBLEM, DECISIONS:140 (3). A secondary control that copies a
         diagnostic block the owner can paste: which screen, which lanes, which
         enrolment state, which build, which device prefix, the user agent and the
         time. It writes NOTHING durable, opens no store and makes no operation.
         Its words, both confirmations and the block itself are bound at runtime
         from today-app.cjs and problem-report.cjs. The text box below it is the
         UNCONDITIONAL fallback the brief requires, not a polyfill: whether
         navigator.clipboard.writeText succeeds inside an installed iOS Home
         Screen app is not verifiable from this repository, so the block is always
         on the screen to select and the copy path is an enhancement. -->
  <button class="link on-scene day-foot" type="button" data-own data-slot="problem-entry"><span data-slot="problem-label"></span></button>
  <p class="note-block day-foot" data-own data-slot="problem-said" hidden></p>
  <div class="field day-foot" data-own data-slot="problem-box" hidden><textarea data-slot="problem-text" readonly></textarea></div>
</div>
<div class="stack">
  <button class="primary" type="button" id="start" data-slot="primary"><span data-slot="primary-label"></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9h17M12 3l6 6-6 6"/></svg></span></button>
