<!-- A1 · Today rebound to the owner-approved 2026-09-08 design.
     Today follows ADDITIONS C — the authoritative implementation reference — structure
     for structure: mast, intro, food with the full-nutrition link, training with the
     recovery link, the trend lines, and a bottom carrying ONE primary action plus the
     coach entry. That is also what keeps the primary action inside one 390x844 viewport
     (review F2); Refinement A's evidence grid and bottom note are what pushed it below
     the fold, and neither is in the authoritative Today.
     Refinement A still supplies the direct-entry control the weigh-in sheet uses, which
     the 2026-09-08 design has no screen for.
     Every class token here is checked against the two pinned stylesheets by design.cjs,
     and every static copy string is checked to occur verbatim in the pinned approved
     HTML. NOTHING here carries a number: every value is bound at runtime from an engine
     result or a stored operation. -->
<template id="t-today">
<article class="page">
  <header class="mast">
    <span class="brand">Earned</span>
    <span class="small muted" data-slot="date"></span>
  </header>
  <section class="intro">
    <p class="label">Your plan for today</p>
    <h1 data-slot="instruction"></h1>
    <p data-slot="instruction-why"></p>
  </section>
  <section class="food">
    <p class="small">Eat about</p>
    <div class="food-grid">
      <div><span class="number" data-slot="kcal"></span> <span class="unit" data-slot="kcal-unit"></span></div>
      <div><span class="number" data-slot="protein"></span> <span class="unit" data-slot="protein-unit"></span></div>
    </div>
    <p class="small muted" data-slot="kcal-note"></p>
    <button class="link" type="button" data-go="nutrition">Your full nutrition plan <span class="muted" data-own data-slot="nutrition-state"></span> <span data-arrow></span></button>
  </section>
  <section class="training">
    <div class="row"><h2 data-slot="workout-title"></h2></div>
    <p class="small muted" data-slot="workout-count"></p>
    <button class="link recovery-link" type="button" data-go="recovery">How are you feeling today? <span class="muted" data-own data-slot="recovery-state"></span> <span data-arrow></span></button>
  </section>
  <button class="link trend" type="button" data-go="why">
    <span><span data-slot="morning"></span><span class="sub" data-slot="trend"></span></span>
    <span data-arrow></span>
  </button>
  <div class="bottom">
    <button class="primary" type="button" data-slot="primary"><span data-slot="primary-label"></span><span data-arrow></span></button>
    <button class="link coach-entry" type="button" data-go="coach"><span>Ask your coach<span class="sub">Your plan, progress and the reasons behind it. <span data-own data-slot="coach-state"></span></span></span><span data-arrow></span></button>
  </div>
</article>
</template>

<template id="t-weigh">
<form class="sheet-panel" role="dialog" aria-modal="true" aria-label="Log this morning's weight">
  <div class="section-label">This morning</div>
  <div class="field">
    <label for="morning-weight">Weight (lb)</label>
    <div class="number-control">
      <button class="step" type="button" data-step="-0.1" aria-label="Decrease weight">−</button>
      <input id="morning-weight" type="number" inputmode="decimal" min="0" step="any" aria-label="Weight in pounds" aria-describedby="weigh-error">
      <button class="step" type="button" data-step="0.1" aria-label="Increase weight">+</button>
    </div>
  </div>
  <p class="error" id="weigh-error" role="alert"></p>
  <div class="gym-actions">
    <button class="cta" type="submit"><span data-slot="weigh-submit"></span><span data-arrow></span></button>
    <div class="secondary-row"><button class="text-link" type="button" data-action="cancel" data-own>Not now</button></div>
  </div>
</form>
</template>

<template id="t-why">
<article class="page">
  <button class="back" type="button" data-go="today"><span aria-hidden="true">←</span> Today</button>
  <header class="detail-head">
    <h1>Why this plan?</h1>
    <p data-slot="why-lead"></p>
  </header>
  <section data-slot="why-sections"></section>
  <div class="bottom">
    <button class="primary" type="button" data-go="today"><span>Back to my plan</span><span data-arrow></span></button>
  </div>
</article>
</template>

<template id="t-nutrition">
<article class="page">
  <button class="back" type="button" data-go="today"><span aria-hidden="true">←</span> Today</button>
  <header class="detail-head">
    <h1>Your food plan.</h1>
    <p>Your agreed daily targets, together in one place.</p>
  </header>
  <section data-slot="macros" aria-label="Daily targets"></section>
  <p class="note">Targets guide your day. Any suggested change comes with a reason and your choice to accept it.</p>
  <p class="note" data-own data-slot="stub-note"></p>
</article>
</template>

<!-- A3 · the recovery check-in. ADDITIONS C's recovery screen (?screen=recovery),
     structure for structure and word for word: its questions, its choices, its
     conditional detail blocks, its optional collapsed note, its one primary action
     and its caption. Two controls the approved prototype has no screen for are
     preview-owned and declared as such in design.cjs: the pair that CONFIRMS an
     existing dated sleep record instead of asking for it twice (the approved
     handoff item 4 requires the reuse; the prototype stores nothing, so it can
     never have a record to reuse). Every answer starts unselected; the view sets
     no aria-pressed="true" and no <option> selected here. -->
<template id="t-recovery">
<article class="page checkin">
  <button class="back" type="button" data-go="today"><span aria-hidden="true">←</span> Today</button>
  <header class="detail-head">
    <h1>A quick check-in.</h1>
    <p>A few details to help put today’s training in context. Answer what you can; leave the rest blank.</p>
  </header>
  <div class="followup" data-slot="recorded" hidden></div>

  <fieldset class="question" data-slot="sleep-question"><legend>Last night’s sleep</legend>
    <div class="followup" data-slot="sleep-known" hidden>
      <p data-own data-slot="sleep-known-lead"></p>
      <p data-own data-slot="sleep-known-fact"></p>
      <div class="options">
        <button class="option" type="button" data-confirm="sleep" aria-pressed="false" data-own>Yes, that’s right</button>
        <button class="option" type="button" data-confirm="reject" aria-pressed="false" data-own>No — answer it here</button>
      </div>
    </div>
    <div data-slot="sleep-ask">
      <div class="sleep-line">
        <input class="hours" id="sleep-hours" type="number" min="0" max="24" step="any" inputmode="decimal" placeholder="—" data-field="sleep_hours">
        <label for="sleep-hours">hours asleep, approximately</label>
      </div>
    </div>
    <p class="quality-label" id="quality-label">How was the quality?</p>
    <div class="options" role="group" aria-labelledby="quality-label">
      <button class="option" type="button" aria-pressed="false" data-group="sleep_quality">Poor</button>
      <button class="option" type="button" aria-pressed="false" data-group="sleep_quality">Okay</button>
      <button class="option" type="button" aria-pressed="false" data-group="sleep_quality">Good</button>
    </div>
  </fieldset>

  <fieldset class="question"><legend>Energy right now</legend><div class="options">
    <button class="option" type="button" aria-pressed="false" data-group="energy">Low</button>
    <button class="option" type="button" aria-pressed="false" data-group="energy">Moderate</button>
    <button class="option" type="button" aria-pressed="false" data-group="energy">High</button>
  </div></fieldset>

  <fieldset class="question"><legend>Muscle soreness right now</legend><div class="options">
    <button class="option" type="button" aria-pressed="false" data-group="soreness">None</button>
    <button class="option" type="button" aria-pressed="false" data-group="soreness">Mild</button>
    <button class="option" type="button" aria-pressed="false" data-group="soreness">Significant</button>
  </div>
  <div class="followup" data-follow="soreness" hidden>
    <label for="sore-location">Which muscles?</label>
    <input id="sore-location" placeholder="For example, quads and glutes" data-field="soreness_location">
    <label for="sore-impact">Does it affect your usual movement?</label>
    <select id="sore-impact" data-field="soreness_impact">
      <option value="">Leave unanswered</option><option>No</option><option>A little</option><option>Quite a lot</option><option>Not sure</option>
    </select>
  </div></fieldset>

  <fieldset class="question"><legend>Stress right now</legend><div class="options">
    <button class="option" type="button" aria-pressed="false" data-group="stress">Low</button>
    <button class="option" type="button" aria-pressed="false" data-group="stress">Moderate</button>
    <button class="option" type="button" aria-pressed="false" data-group="stress">High</button>
  </div></fieldset>

  <fieldset class="question"><legend>Anything else affecting today?</legend><div class="options">
    <button class="option" type="button" aria-pressed="false" data-issue="pain">Pain</button>
    <button class="option" type="button" aria-pressed="false" data-issue="illness">Feeling ill</button>
    <button class="option" type="button" aria-pressed="false" data-issue="away">Time away</button>
  </div>
  <div class="followup" data-follow="pain" hidden>
    <p>Keep pain separate from ordinary muscle soreness.</p>
    <label for="pain-location">Where, and during which movement?</label>
    <input id="pain-location" placeholder="Location and movement" data-field="pain_location">
    <label for="pain-change">Is this new or changed?</label>
    <select id="pain-change" data-field="pain_change">
      <option value="">Leave unanswered</option><option>New</option><option>Worse than before</option><option>Ongoing, unchanged</option><option>Improving</option><option>Not sure</option>
    </select>
    <label for="pain-impact">How does it affect movement?</label>
    <select id="pain-impact" data-field="pain_impact">
      <option value="">Leave unanswered</option><option>No noticeable effect</option><option>I change how I move</option><option>I cannot do the movement</option><option>Not sure</option>
    </select>
  </div>
  <div class="followup" data-follow="illness" hidden>
    <label for="ill-note">What symptoms, and when did they start?</label>
    <input id="ill-note" placeholder="What you have noticed" data-field="illness_note">
  </div>
  <div class="followup" data-follow="away" hidden>
    <label for="away-days">About how many days away from training?</label>
    <input id="away-days" type="number" min="0" step="1" inputmode="numeric" placeholder="Days" data-field="away_days">
    <label for="away-reason">What was the reason?</label>
    <input id="away-reason" placeholder="Optional" data-field="away_reason">
  </div></fieldset>

  <details class="checkin-note"><summary>Add a note, if useful</summary>
    <label class="note-label" for="recovery-note">Anything the answers missed?</label>
    <textarea id="recovery-note" placeholder="What else should your coach know?" data-field="note"></textarea>
  </details>

  <p class="error" id="checkin-error" role="alert"></p>
  <div class="bottom">
    <button class="primary" type="button" data-slot="primary"><span data-slot="primary-label">Add today’s context</span><span data-arrow></span></button>
    <p class="caption">Your answers belong alongside your training data.</p>
    <p class="fine" data-own data-slot="fine"></p>
  </div>
</article>
</template>

<template id="t-coach">
<article class="page">
  <button class="back" type="button" data-go="today"><span aria-hidden="true">←</span> Today</button>
  <header class="detail-head">
    <h1>Ask your coach.</h1>
    <p>Make sense of your plan and the progress behind it.</p>
  </header>
  <p class="note" data-own data-slot="stub-note"></p>
</article>
</template>

<template id="t-workout">
<article class="page">
  <button class="back" type="button" data-go="today"><span aria-hidden="true">←</span> Today</button>
  <header class="detail-head">
    <h1 data-slot="workout-title"></h1>
    <p data-own data-slot="stub-note"></p>
  </header>
  <p class="note" data-own data-slot="workout-detail"></p>
</article>
</template>

<!-- A2 · the gym card. These two screens are REFINEMENT A's reviewed workout and
     saved-set/rest screens (Refinement-Workout.png, Refinement-Rest.png), structure
     for structure, in A's own classes. Every value is bound at runtime from the
     accepted capture layer or from a stored operation; as everywhere in this page,
     no element here carries a figure. Two elements of A's rest screen are absent
     and the report says why: the countdown timer and its +30s/Pause controls price
     a rest length the accepted engine does not prescribe. -->
<template id="t-gym">
<article class="page">
  <div class="gym-nav">
    <button class="back" type="button" data-action="back"><span aria-hidden="true">←</span> <span data-slot="session-title"></span></button>
    <span data-slot="exercise-position"></span>
  </div>
  <div class="gym-head">
    <h1 data-slot="lift"></h1>
    <button class="text-link" type="button" data-action="setup">Setup <span data-arrow></span></button>
  </div>
  <div data-slot="reason"></div>
  <p class="change"><button class="why-inline" type="button" data-action="why">Why?</button></p>
  <div class="small quiet" data-slot="setup-note" hidden></div>
  <div class="set-strip" aria-label="Set progress" data-slot="strip"></div>
  <section class="prescription">
    <div class="small quiet">This set’s plan</div>
    <h2 data-slot="plan"></h2>
    <p class="effort-target" data-slot="effort-target"></p>
  </section>
  <section class="entry">
    <div class="entry-header">
      <h2 data-slot="entry-title"></h2>
      <span data-slot="previous"></span>
    </div>
    <div class="fields">
      <div class="field">
        <label for="gym-weight">Weight (lb)</label>
        <div class="number-control">
          <button class="step" type="button" data-step="load:-1" aria-label="Decrease weight">−</button>
          <input id="gym-weight" type="number" inputmode="decimal" min="0" step="any" aria-label="Actual weight in pounds" aria-describedby="gym-error">
          <button class="step" type="button" data-step="load:1" aria-label="Increase weight">+</button>
        </div>
      </div>
      <div class="field">
        <label for="gym-reps">Reps</label>
        <div class="number-control">
          <button class="step" type="button" data-step="reps:-1" aria-label="Decrease reps">−</button>
          <input id="gym-reps" type="number" inputmode="numeric" min="0" step="1" aria-label="Actual reps" aria-describedby="gym-error">
          <button class="step" type="button" data-step="reps:1" aria-label="Increase reps">+</button>
        </div>
      </div>
    </div>
    <fieldset class="effort">
      <legend>Clean reps left <span class="quiet">at the end</span></legend>
      <div class="choices" data-slot="choices"></div>
    </fieldset>
    <p class="error" id="gym-error" role="alert"></p>
  </section>
  <div class="gym-actions">
    <button class="cta" type="button" data-slot="log"><span data-slot="log-label"></span><span data-check></span></button>
    <!-- A3 · the check-in is reachable from the workout flow too, in the approved
         design's own sentence. Hidden unless the page supplies the check-in entry. -->
    <div class="secondary-row"><button class="text-link" type="button" data-action="clean-rep">What counts as a clean rep?</button><button class="text-link" type="button" data-action="checkin" hidden>How are you feeling today?</button></div>
    <div class="small quiet" data-slot="clean-rep-note" hidden></div>
  </div>
  <div class="next-lift">
    <div><div class="quiet">Up next</div><div class="name" data-slot="up-next"></div></div>
  </div>
</article>
</template>

<template id="t-rest">
<article class="page">
  <div class="gym-nav">
    <button class="back" type="button" data-action="back"><span aria-hidden="true">←</span> <span data-slot="session-title"></span></button>
    <span data-slot="exercise-position"></span>
  </div>
  <div class="gym-head">
    <h1 data-slot="lift"></h1>
  </div>
  <div data-slot="reason"></div>
  <section class="saved-block" aria-live="polite">
    <div>
      <div class="saved-title"><span data-check></span><span data-slot="saved-title"></span></div>
      <p class="saved-facts" data-slot="saved-facts"></p>
    </div>
    <button class="text-link" type="button" data-action="undo">Undo</button>
  </section>
  <section class="rest">
    <div class="rest-heading"><h2>Take your rest.</h2></div>
    <div class="small quiet" data-own data-slot="rest-note"></div>
  </section>
  <section class="next-set">
    <p class="small" data-slot="next-label"></p>
    <h2 data-slot="next-plan"></h2>
    <p data-slot="next-effort"></p>
  </section>
  <div class="bottom">
    <button class="cta" type="button" data-slot="primary"><span data-slot="primary-label"></span><span data-arrow></span></button>
    <button class="text-link" type="button" data-action="back">Back to Today</button>
  </div>
</article>
</template>
